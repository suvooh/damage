[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-damage-detection"
version = "1.0.0"
description = "Standalone DINOv2 exterior vehicle damage segmentation and inference API."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "Pillow>=11,<13",
  "timm>=1.0,<2",
  "torch>=2.3",
  "torchvision>=0.18",
  "onnx>=1.17",
  "onnxruntime>=1.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]
snapdragon = [
  "onnxruntime-qnn>=2.6",
]

[project.scripts]
vehicle-damage = "vehicle_damage.cli:main"
vehicle-damage-api = "vehicle_damage.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
vehicle_damage = ["static/*.html", "static/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
